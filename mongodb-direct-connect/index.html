<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>simple api page</title>
</head>

<body>
    <h1>Simple Api</h1>

    <script>
        async function getApiData() {
            try {
                let data = await fetch("http://localhost:2000/get-users");
                data = await data.json();
                console.log(data);
            } catch (error) {
                console.log(error);
            }
        }

        getApiData();
    </script>
</body>

</html>
