<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup</title>
</head>

<body>
    <h1>Signup</h1>
    <form>
        <div>
            <label for="">Full Name :</label>
            <input type="text" placeholder="Enter Your Full Name" id="name">
        </div>
        <div>
            <label for="">Email :</label>
            <input type="email" placeholder="Enter Your Email Id" id="email">
        </div>
        <div>
            <label for="">Password :</label>
            <input type="password" placeholder="Enter Password" id="password">
        </div>
        <div>
            <label for="">Mob. :</label>
            <input type="number" placeholder="Enter Mobile No." id="number">
        </div>
    </form>
    <button onclick="handleSubmit()">Signup</button>

    <script>
        let name = document.getElementById("name");
        let email = document.getElementById("email");
        let password = document.getElementById("password");
        let number = document.getElementById("number");


        async function handleSubmit() {
            let name_val = name.value;
            let email_val = email.value;
            let pass_val = password.value;
            let num_val = number.value;

            try {
                let data = await fetch("http://localhost:7000/api/registration", {
                    method: "POST",
                    body: JSON.stringify({ fullname: name_val, email: email_val, password: pass_val, number: num_val }),
                    headers: {
                        "Content-Type": "application/json"
                    }
                });
                data = await data.json();
                console.log(data);
            } catch (error) {
                console.log(error);
            }
        }
    </script>
</body>

</html>
