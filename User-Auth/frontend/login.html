<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=\, initial-scale=1.0">
    <title>Login</title>
</head>

<body>
    <h1>Login</h1>
    <form>

        <div>
            <label for="">Email :</label>
            <input type="email" placeholder="Enter Your Email Id" id="email">
        </div>
        <div>
            <label for="">Password :</label>
            <input type="password" placeholder="Enter Password" id="password">
        </div>

    </form>
    <button onclick="handleSubmit()">Login</button>

    <script>
        let email = document.getElementById("email");
        let password = document.getElementById("password");

        async function handleSubmit() {
            let email_val = email.value;
            let pass_val = password.value;
            try {
                let data = await fetch("http://localhost:7000/api/login", {
                    method: "POST",
                    body: JSON.stringify({ email: email_val, password: pass_val }),
                    headers: {
                        "Content-Type": "application/json"
                    }
                })
                data = await data.json();
                localStorage.setItem("token", data.token);
                console.log(data);
            } catch (error) {
                console.log(error);
            }
        }
    </script>
</body>

</html>
