<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
</head>

<body onload="loadData()">
    <h1>Home Page</h1>


    <script>
        let token = localStorage.getItem("token");
        async function loadData() {
            try {
                let data = await fetch("http://localhost:7000/api/user", {
                    headers: {
                        authorization: token
                    }
                });
                data = await data.json();
                console.log(data);
            } catch (error) {
                console.log(error);
            }
        }
    </script>
</body>

</html>
